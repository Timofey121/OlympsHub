# OlympiadHub Docker Compose Configuration
# This file defines all services required to run the OlympiadHub platform

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    networks:
      - olympiad_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympiad_user -d olympiadhub"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Django Web Application Service
  django:
    build: ./Site
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Site:/Site
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    env_file:
      - .env.db
      - Site/.env.site
    ports:
      - "8000:8000"
    networks:
      - olympiad_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 Site.wsgi"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Telegram Bot Service
  telegram_bot:
    build: ./TelegramBot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      django:
        condition: service_healthy
    env_file:
      - .env.db
      - TelegramBot/.env.tg
    networks:
      - olympiad_network
    command: [ "python", "main_olympiads.py" ]

  # Nginx Reverse Proxy Service
  nginx:
    restart: always
    build: ./nginx
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    ports:
      - "80:80"
      - "443:443"
    networks:
      - olympiad_network

  # Redis Cache and Message Broker Service
  redis:
    image: "redis:alpine"
    restart: always
    networks:
      - olympiad_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower - Celery Monitoring Service
  flower:
    image: mher/flower
    environment:
      - FLOWER_PORT=5555
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    networks:
      - olympiad_network
    depends_on:
      redis:
        condition: service_healthy

  # Celery Worker Service
  celery_worker:
    restart: always
    build: ./Site
    volumes:
      - .:/usr/src/app
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env.db
      - Site/.env.site
    command: 'celery -A Site worker -l info -E'
    networks:
      - olympiad_network

  # Celery Beat Scheduler Service
  celery_beat:
    restart: always
    build: ./Site
    volumes:
      - .:/usr/src/app
    depends_on:
      redis:
        condition: service_healthy
      django:
        condition: service_healthy
      celery_worker:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env.db
      - Site/.env.site
    command: 'celery -A Site beat -l info'
    networks:
      - olympiad_network


volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  olympiad_network:
    driver: bridge