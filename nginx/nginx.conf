# OlympiadHub Nginx Configuration
# Upstream configuration for Django application
upstream django_server {
    server django:8000;
}

# HTTP server block - redirects all traffic to HTTPS
server {
    listen 80;
    server_name olympshub.ru www.olympshub.ru localhost;

    # Redirect all HTTP requests to HTTPS for security
    return 301 https://$host$request_uri;
}

# HTTPS server block - main application server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name olympshub.ru www.olympshub.ru localhost;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/olympshub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/olympshub.ru/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 70;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_stapling on;
    resolver 8.8.8.8;
    ssl_trusted_certificate /etc/letsencrypt/live/olympshub.ru/chain.pem;  # Optional

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Main application proxy
    location / {
        proxy_pass http://django_server;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }

    # Static files serving
    location /static/ {
        alias /home/app/web/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files serving
    location /media/ {
        alias /home/app/web/mediafiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health/ {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
